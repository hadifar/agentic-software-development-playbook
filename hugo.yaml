baseURL: "https://hadifar.net/"
languageCode: en-us
title: "Amir Hadifar"
theme: PaperMod

pagination:
  pagerSize: 10

enableInlineShortcodes: true
enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false
pygmentsUseClasses: true

googleAnalytics: ""

minify:
  disableXML: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  category: categories

permalinks:
  posts: /posts/:slug/
  categories: /categories/:slug/

params:
  env: production
  title: "Amir Hadifar"
  description: >-
    Amir Hadifar's personal blog on AI, ML, agents, LLMs, and agentic software development —
    concepts, tools, workflows, and resources from building with these systems day to day.
  keywords: [Blog, AI, ML, LLM, Agents, Agentic Software Development]
  author: "Amir Hadifar"

  defaultTheme: auto
  disableThemeToggle: false
  ShowShareButtons: true
  ShowReadingTime: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  TocOpen: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  UseHugoToc: true

  homeInfoParams:
    Title: "AI Explorer 🦭"
    Content: >-
      Personal blog on AI, ML, agents, LLMs, and agentic software development.

  socialIcons:
    - name: github
      url: "https://github.com/hadifar"
    - name: x
      url: "https://x.com/hadif4r"
    - name: email
      url: "mailto:hadifar.amir@gmail.com"

  assets:
    favicon: "/favicons/favicon.ico"
    favicon16x16: "/favicons/favicon-16x16.png"
    favicon32x32: "/favicons/favicon-32x32.png"
    apple_touch_icon: "/favicons/apple-touch-icon.png"
    disableFingerprinting: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 10
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 40
    - identifier: search
      name: Search
      url: /search/
      weight: 50

markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
