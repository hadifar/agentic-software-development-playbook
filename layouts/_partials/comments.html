<script src="https://giscus.app/client.js"
    data-repo="hadifar/blog"
    data-repo-id="R_kgDOTaXaIw"
    data-category="Announcements"
    data-category-id="DIC_kwDOTaXaI84DD5wu"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="bottom"
    data-theme="{{ if eq site.Params.defaultTheme `dark` }}dark{{ else }}light{{ end }}"
    data-lang="en"
    crossorigin="anonymous"
    async>
</script>
<script>
  (function () {
    const setGiscusTheme = (theme) => {
      const iframe = document.querySelector('iframe.giscus-frame');
      if (!iframe) return;
      iframe.contentWindow.postMessage({ giscus: { setConfig: { theme } } }, 'https://giscus.app');
    };

    const currentTheme = () => document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';

    window.addEventListener('message', (event) => {
      if (event.origin !== 'https://giscus.app') return;
      if (!(event.data?.giscus?.discussion)) return;
      setGiscusTheme(currentTheme());
    });

    const themeToggle = document.getElementById('theme-toggle');
    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        setTimeout(() => setGiscusTheme(currentTheme()), 0);
      });
    }
  })();
</script>
